# Render Blueprint: deploys the Django API. The database lives elsewhere (e.g. Neon),
# so its connection details are secrets you fill in on the Render dashboard.
services:
  - type: web
    name: beauty-admin-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: >-
      python manage.py migrate &&
      python manage.py create_demo_admin &&
      python manage.py seed_demo &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/auth/me/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false # e.g. beauty-admin-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://your-admin.vercel.app
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: DEMO_ADMIN_USERNAME
        value: admin
      - key: DEMO_ADMIN_PASSWORD
        sync: false # choose a strong password; this is what you log in with
